<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>時空旅人的心聲：台灣歷史臆謎猜</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #0f172a;
            background-image: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            color: #f8fafc;
        }
        .game-container {
            box-shadow: 0 0 40px rgba(99, 102, 241, 0.2);
        }
        .dialog-box {
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid #6366f1;
            box-shadow: inset 0 0 20px rgba(99, 102, 241, 0.3), 0 4px 6px rgba(0,0,0,0.5);
            position: relative;
        }
        .cursor-blink::after {
            content: '▼';
            display: inline-block;
            margin-left: 8px;
            font-size: 0.8em;
            color: #818cf8;
            animation: blink 1s step-end infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        .choice-btn {
            transition: all 0.2s ease-in-out;
        }
        .choice-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
            border-color: #818cf8;
            background-color: rgba(79, 70, 229, 0.1);
        }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle linear infinite;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.5); }
            50% { opacity: 0.8; transform: scale(1); }
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex items-center justify-center relative">

    <div id="stars-container" class="absolute inset-0 z-0 pointer-events-none opacity-50"></div>

    <main class="game-container relative z-10 w-full max-w-4xl h-[95vh] sm:h-[600px] bg-slate-900 sm:rounded-2xl border border-slate-700 flex flex-col overflow-hidden">
        
        <header class="bg-slate-950 p-4 border-b border-slate-800 flex justify-between items-center shrink-0">
            <h1 class="text-indigo-400 font-black text-lg md:text-xl tracking-widest flex items-center gap-2">
                <span class="text-2xl">⏳</span> 時空旅人的心聲 (GitHub Education)
            </h1>
            <div id="progress-container" class="hidden text-slate-400 font-bold bg-slate-800 px-3 py-1 rounded-full text-sm">
                題數: <span id="current-q-num" class="text-white">1</span> / <span id="total-q-num">14</span>
            </div>
        </header>

        <!-- 首頁 -->
        <section id="screen-start" class="flex-1 flex flex-col items-center justify-center p-8 text-center fade-in">
            <div class="text-6xl mb-6 drop-shadow-[0_0_15px_rgba(99,102,241,0.8)]">💀</div>
            <h2 class="text-3xl md:text-4xl font-black text-rose-500 mb-4">歷史對話臆謎猜：史學深淵版</h2>
            <p class="text-slate-400 max-w-md mx-auto mb-8 leading-relaxed">
                無人名、無地名，全靠時代社會氛圍推敲。<br>
                專為上傳至 GitHub Pages / education 資料夾打造！
            </p>
            <input type="text" id="player-name" placeholder="請輸入你的大名..." class="mb-6 px-6 py-3 rounded-full text-slate-900 font-bold w-64 text-center focus:outline-none focus:ring-4 focus:ring-indigo-500 bg-slate-100" />
            <button onclick="startGame()" class="bg-rose-700 hover:bg-rose-600 text-white font-bold py-3 px-8 rounded-full text-lg shadow-lg transition-all transform hover:scale-105 active:scale-95 border border-rose-400">
                開始挑戰
            </button>
        </section>

        <!-- 遊戲進行中 -->
        <section id="screen-play" class="hidden flex-1 flex flex-col p-4 md:p-8 relative">
            <div class="flex-1 flex flex-col justify-end mb-6 relative">
                <div class="flex justify-center mb-4 relative z-10">
                    <div id="character-avatar" class="w-32 h-32 md:w-40 md:h-40 bg-slate-800 rounded-full border-4 border-indigo-500 flex items-center justify-center text-7xl shadow-xl">
                        🧑🏽‍🌾
                    </div>
                    <div id="character-name" class="absolute -bottom-3 bg-indigo-600 text-white px-4 py-1 rounded-full text-sm font-bold border border-indigo-400 shadow-md">
                        神秘發言人
                    </div>
                </div>
                <div class="dialog-box rounded-xl p-5 md:p-6 min-h-[140px] md:min-h-[160px] relative z-20">
                    <p id="dialog-text" class="text-lg md:text-xl text-slate-100 leading-relaxed font-medium"></p>
                </div>
            </div>
            <div id="choices-grid" class="grid grid-cols-2 md:grid-cols-4 gap-3 shrink-0"></div>
        </section>

        <!-- 結算畫面 -->
        <section id="screen-end" class="hidden flex-1 flex flex-col items-center justify-center p-8 text-center">
            <h2 class="text-4xl font-black text-white mb-2">測驗結束！</h2>
            <p class="text-slate-400 mb-6">歷史時空旅行順利完成</p>
            
            <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 mb-6 shadow-xl max-w-sm w-full">
                <div class="text-sm text-slate-400 mb-1">最終得分</div>
                <div class="text-5xl font-black text-amber-400 mb-2">
                    <span id="final-score">0</span><span class="text-xl text-slate-500 ml-1">/ 100</span>
                </div>
                <div id="final-comment" class="text-base font-bold text-indigo-300"></div>
            </div>

            <button onclick="resetGame()" class="bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 px-8 rounded-full shadow-lg transition-all active:scale-95 border border-slate-500">
                閣耍一擺
            </button>
        </section>

    </main>

    <!-- 答題回饋 Modal -->
    <div id="feedback-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
        <div class="bg-slate-800 border-2 rounded-2xl p-6 md:p-8 max-w-lg w-full shadow-2xl relative" id="feedback-box">
            <div class="flex items-center gap-4 mb-4">
                <div id="feedback-icon" class="text-4xl shrink-0">✅</div>
                <h3 id="feedback-title" class="text-2xl font-black text-white"></h3>
            </div>
            <div class="bg-slate-900 rounded-lg p-4 mb-6 border border-slate-700">
                <p id="feedback-explanation" class="text-slate-300 leading-relaxed text-sm md:text-base"></p>
            </div>
            <button onclick="nextQuestion()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 px-6 rounded-xl shadow-lg transition-all active:scale-95 border border-indigo-400">
                繼續下一題 ➔
            </button>
        </div>
    </div>

    <script>
        const eraChoices = [
            "史前時代", "荷西時期", "明鄭時期", "清治時期", "日治時期", "戰後與戒嚴", "民主化現代"
        ];

        const allQuestions = [
            { character: "???", avatar: "👤", quote: "長官利用阮佮隔壁社的冤仇，𤆬大軍來逼阮簽下協約。這馬，阮毋但愛將象徵主權的菁仔佮樹仔栽交予外口人，猶閣被逼去鬥拍中部的部落聯盟。", era: "荷西時期", explanation: "【1635年 麻豆協約】荷蘭東印度公司藉由武力與分化策略，迫使西拉雅族麻豆社臣服，交出檳榔與樹苗象徵主權讓渡。" },
            { character: "???", avatar: "👤", quote: "阮蹛佇這片山壁邊、向海的所在已經好幾代矣。最近除了用懸溫的土窯將石頭變成『鐵器』，阮猶閣將山頂的閃玉加工，佮遐的對南方坐船過來的生理人交捽玻璃手環。", era: "史前時代", explanation: "【距今約2000-1000年 漢本遺址】證明當時台灣東海岸已捲入廣大的南海貿易圈。" },
            { character: "???", avatar: "👤", quote: "相國大人為著欲摒西征的軍費，竟然下令鑄造新銅錢，甚至硬強要求民間將銅器鎔掉。加上最近佮外洋的生理人買傷濟火銃，這馬市面上物價起甲足懸！", era: "明鄭時期", explanation: "【明鄭末期 經濟崩潰】陳永華為應付三藩之亂的西征軍費，發行永曆通寶劣幣導致嚴重通膨。" },
            { character: "???", avatar: "👤", quote: "彼个漢人，竟然提著假造的官府墾照，𤆬一大陣武裝的鄉勇越界衝入來阮的盆地，大範屠殺阮的族人，猶閣將阮的土地搶走。", era: "清治時期", explanation: "【1814年 郭百年事件】漢人持偽造文書武裝侵墾埔里盆地並屠殺原住民，引發平埔族大遷徙。" },
            { character: "???", avatar: "👤", quote: "自從彼種新的稻仔種種出來了後，逐家發現種水稻趁較濟，紛紛將甘蔗園改種水稻矣。會社遐的高層氣甲跳跤，因為in的原料無夠矣！", era: "日治時期", explanation: "【1920年代 米糖相剋】蓬萊米外銷利潤高，農民轉作水稻，威脅日本資本家掌控的製糖業。" },
            { character: "???", avatar: "👤", quote: "阮佇監獄內底已經委決足久矣。利用今仔日衛兵換班的空檔，阮奪取槍械，準備欲衝出去佔領廣播電台，向全世界呼籲獨立。", era: "戰後與戒嚴", explanation: "【1970年 泰源事件】具台獨意識的政治犯與台籍士兵聯合發動武裝起義。" },
            { character: "???", avatar: "👤", quote: "政府為著欲加入彼个國際貿易組織，全面開放外國農產品進口。阮種的作物根本競爭袂贏，農村擋袂牢欲崩去矣。", era: "民主化現代", explanation: "【2003-2004年 白米炸彈客事件】台灣加入WTO衝擊本土農業引發之抗爭。" },
            { character: "???", avatar: "👤", quote: "阮的部落規个人攏咧磨玉，將彼種青綠色的石頭做成管珠佮耳鉤。等阮轉去祖靈遐的時，親人會用一塊一塊的板岩共阮疊做厝。", era: "史前時代", explanation: "【距今約3000-2000年 卑南文化】以精緻玉器加工與板岩棺墓葬聞名。" },
            { character: "???", avatar: "👤", quote: "阮對南方的大港口坐船來到這个北部的海灣，起了一座石頭城。本底想欲佮對岸的大國做白銀生理，順紲傳播天主的福音。", era: "荷西時期", explanation: "【1626-1642年 西班牙人統治北台灣】在雞籠建立聖薩爾瓦多城。" },
            { character: "???", avatar: "👤", quote: "阮綴大軍渡海過來，本底想講會當反攻中原。結果這馬將軍叫阮放落刀劍，攑起鋤頭去山林邊仔開墾。規个營一半以上的兄弟攏去著瘴氣破病死。", era: "明鄭時期", explanation: "【明鄭時期 屯田制】士兵派駐各地開墾，常受瘧疾與水土不服之苦。" },
            { character: "???", avatar: "👤", quote: "自從前幾年彼場大造反了後，朝廷為著獎賞阮幫手平亂，賜予阮免納租的土地，但是要求阮愛顧佇淺山地帶，防備遐的生番落山出草。", era: "清治時期", explanation: "【1790年 實施番屯制】林爽文事件後獎勵平原原住民設屯防守。" },
            { character: "???", avatar: "👤", quote: "街仔路規个打扮甲光爍爍，四界攏是霓虹燈佮新的西洋建築。官府辦這个超大型的展覽，欲向世界展示統治四十冬的進步。", era: "日治時期", explanation: "【1935年 台灣博覽會】總督府展示殖民現代性成果的大型博覽會。" },
            { character: "???", avatar: "👤", quote: "國中一畢業，我就離鄉背井來到南部的加工區做女工。逐工佇生產線上紩成衣、銲接收音機的零件，規個月加班趁的錢攏寄轉去庄跤。", era: "戰後與戒嚴", explanation: "【1960年代 加工出口區與女工】經濟起飛背後的基層勞力剝削。" },
            { character: "???", avatar: "👤", quote: "動員戡亂雖然廢除矣，但是彼條『預備叛亂』的惡法猶佇咧！干焦因為思想、寫文章就可能被判死刑，這算啥物民主?", era: "民主化現代", explanation: "【1991-1992年 100行動聯盟】廢除刑法100條之非暴力抗爭運動。" }
        ];

        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let isTyping = false;
        let typingTimeout;
        let currentPlayerName = "無名氏";

        window.startGame = startGame;
        window.resetGame = resetGame;
        window.nextQuestion = nextQuestion;

        const screens = {
            start: document.getElementById('screen-start'),
            play: document.getElementById('screen-play'),
            end: document.getElementById('screen-end')
        };
        const dialogText = document.getElementById('dialog-text');
        const choicesGrid = document.getElementById('choices-grid');
        const charName = document.getElementById('character-name');
        const charAvatar = document.getElementById('character-avatar');
        const progressContainer = document.getElementById('progress-container');
        const currentQNum = document.getElementById('current-q-num');
        const totalQNumSpan = document.getElementById('total-q-num');
        const feedbackModal = document.getElementById('feedback-modal');
        const feedbackBox = document.getElementById('feedback-box');

        function createStars() {
            const container = document.getElementById('stars-container');
            for(let i=0; i<25; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.width = Math.random() * 3 + 'px';
                star.style.height = star.style.width;
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 2 + 's';
                container.appendChild(star);
            }
        }
        createStars();

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function showScreen(screenName) {
            Object.values(screens).forEach(s => {
                s.classList.add('hidden');
                s.classList.remove('fade-in');
            });
            screens[screenName].classList.remove('hidden');
            screens[screenName].classList.add('fade-in');
        }

        function startGame() {
            const nameInput = document.getElementById('player-name').value.trim();
            if (nameInput) currentPlayerName = nameInput;

            score = 0;
            currentQuestionIndex = 0;
            currentQuestions = shuffle([...allQuestions]);
            totalQNumSpan.innerText = currentQuestions.length;
            
            progressContainer.classList.remove('hidden');
            showScreen('play');
            loadQuestion();
        }

        function resetGame() {
            showScreen('start');
            progressContainer.classList.add('hidden');
        }

        function loadQuestion() {
            const q = currentQuestions[currentQuestionIndex];
            currentQNum.innerText = currentQuestionIndex + 1;
            charName.innerText = q.character;
            charAvatar.innerText = q.avatar;
            
            choicesGrid.innerHTML = '';
            dialogText.innerHTML = '';
            
            eraChoices.forEach(era => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn bg-slate-800 border border-slate-600 text-slate-200 py-3 px-2 rounded-xl text-sm md:text-base font-bold shadow-md';
                btn.innerText = era;
                btn.onclick = () => checkAnswer(era);
                choicesGrid.appendChild(btn);
            });

            typeWriterEffect(q.quote);
        }

        function typeWriterEffect(text) {
            clearTimeout(typingTimeout);
            isTyping = true;
            dialogText.classList.add('cursor-blink');
            dialogText.innerText = '';
            
            let i = 0;
            function typeChar() {
                if (i < text.length) {
                    dialogText.innerText += text.charAt(i);
                    i++;
                    typingTimeout = setTimeout(typeChar, 30);
                } else {
                    isTyping = false;
                    dialogText.classList.remove('cursor-blink');
                }
            }
            typeChar();
        }

        function checkAnswer(selectedEra) {
            if (isTyping) {
                clearTimeout(typingTimeout);
                isTyping = false;
                dialogText.classList.remove('cursor-blink');
                dialogText.innerText = currentQuestions[currentQuestionIndex].quote;
            }

            const q = currentQuestions[currentQuestionIndex];
            const isCorrect = (selectedEra === q.era);

            if (isCorrect) {
                score += (100 / currentQuestions.length);
            }

            showFeedback(isCorrect, q.era, q.explanation);
        }

        function showFeedback(isCorrect, correctEra, explanation) {
            feedbackModal.classList.remove('hidden');
            feedbackBox.classList.remove('fade-in');
            void feedbackBox.offsetWidth;
            feedbackBox.classList.add('fade-in');

            const icon = document.getElementById('feedback-icon');
            const title = document.getElementById('feedback-title');
            const expl = document.getElementById('feedback-explanation');

            if (isCorrect) {
                icon.innerText = '🎉';
                title.innerText = '臆著啦！';
                title.className = 'text-2xl font-black text-emerald-400';
                feedbackBox.style.borderColor = '#34d399';
            } else {
                icon.innerText = '🤔';
                title.innerText = `臆毋著囉！正確年代是「${correctEra}」`;
                title.className = 'text-xl md:text-2xl font-black text-rose-400';
                feedbackBox.style.borderColor = '#fb7185';
            }

            expl.innerHTML = `<strong class="text-white block mb-1">歷史背景解密：</strong>${explanation}`;
        }

        function nextQuestion() {
            feedbackModal.classList.add('hidden');
            currentQuestionIndex++;
            if (currentQuestionIndex < currentQuestions.length) {
                loadQuestion();
            } else {
                endGame();
            }
        }

        function endGame() {
            showScreen('end');
            progressContainer.classList.add('hidden');
            
            const finalScoreEl = document.getElementById('final-score');
            const finalCommentEl = document.getElementById('final-comment');
            let finalScore = Math.round(score);
            
            let currentDisplay = 0;
            const step = finalScore / 30;
            const timer = setInterval(() => {
                currentDisplay += step;
                if (currentDisplay >= finalScore) {
                    currentDisplay = finalScore;
                    clearInterval(timer);
                }
                finalScoreEl.innerText = Math.round(currentDisplay);
            }, 30);

            if (finalScore === 100) {
                finalCommentEl.innerText = "完美過關！你是正港的時空歷史學家！🏆";
            } else if (finalScore >= 70) {
                finalCommentEl.innerText = "表現袂䆀！對台灣歷史有相當的了解！👍";
            } else if (finalScore >= 40) {
                finalCommentEl.innerText = "繼續拍拚！差一點仔就會當拼湊出完整的歷史輪廓矣！💪";
            } else {
                finalCommentEl.innerText = "親像迷失佇時空亂流內底矣，加讀淡薄仔歷史冊閣來挑戰吧！📚";
            }
        }
    </script>
</body>
</html>
